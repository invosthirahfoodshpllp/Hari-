<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - Sthirah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page {
            padding: 2rem;
            background: var(--bg-color);
            min-height: 100vh;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }
        .admin-header h1 { color: var(--accent-green); }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .orders-table th, .orders-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }
        .orders-table th {
            background: #eef7f1;
            font-weight: 700;
            color: var(--accent-green);
        }
        .orders-table tr:hover { background: #f9f9f9; }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-shipped { background: #cce5ff; color: #004085; }
        .status-delivered { background: #d4edda; color: #155724; }
        
        .action-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 0.5rem;
        }
        .action-btn:hover { background: #eee; }
        .print-btn { color: var(--accent-green); border-color: var(--accent-green); }
        .print-btn:hover { background: var(--accent-green); color: #fff; }

        .admin-guard {
            text-align: center;
            padding: 4rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 500px;
            margin: 4rem auto;
        }

        /* Printable Area */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 2rem; }
        }
    </style>
</head>
<body>
    <div id="authGuard" class="admin-guard">
        <h2>Admin Access Required</h2>
        <p>Checking permissions...</p>
    </div>

    <div id="adminApp" class="admin-page" style="display: none;">
        <div class="admin-header">
            <h1>Orders Management</h1>
            <a href="index.html" class="action-btn">Back to Website</a>
        </div>
        
        <table class="orders-table">
            <thead>
                <tr>
                    <th>Order Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTbody">
                <tr><td colspan="6" style="text-align:center;">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Hidden Print Area -->
    <div id="printArea" style="display:none; font-family: sans-serif;">
        <h2 style="text-align:center; border-bottom:1px solid #ccc; padding-bottom:10px;">Sthirah - Order Details</h2>
        <div id="printContent"></div>
    </div>

    <script type="module">
        import { auth, db, onAuthStateChanged, collection, getDocs, updateDoc, doc, query, orderBy } from './firebase-config.js';

        const guard = document.getElementById('authGuard');
        const app = document.getElementById('adminApp');
        const tbody = document.getElementById('ordersTbody');
        let ordersList = [];

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html?redirect=admin.html';
            } else {
                // Anyone logged in can see this for now, but ideally we'd check if user.email === 'admin@sthirah.com'
                guard.style.display = 'none';
                app.style.display = 'block';
                fetchOrders();
            }
        });

        async function fetchOrders() {
            try {
                const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                ordersList = [];
                tbody.innerHTML = '';
                
                if(querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No orders found.</td></tr>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    data.id = docSnap.id;
                    ordersList.push(data);
                    
                    const date = data.createdAt ? new Date(data.createdAt.toMillis()).toLocaleString() : 'Just now';
                    const itemsStr = data.items.map(i => `${i.name} (${i.size}) x${i.qty}`).join('<br>');
                    
                    let statusClass = 'status-pending';
                    if (data.status === 'Shipped') statusClass = 'status-shipped';
                    if (data.status === 'Delivered') statusClass = 'status-delivered';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${date}</td>
                        <td>
                            <strong>${data.customerName}</strong><br>
                            ${data.customerPhone}<br>
                            <small>${data.customerAddress}<br>Pin: ${data.customerPin}</small>
                        </td>
                        <td>${itemsStr}</td>
                        <td>&#8377;${data.totalAmount}</td>
                        <td><span class="status-badge ${statusClass}">${data.status}</span></td>
                        <td>
                            <select onchange="changeStatus('${data.id}', this.value)" class="action-btn">
                                <option value="" disabled selected>Change Status</option>
                                <option value="Pending">Pending</option>
                                <option value="Shipped">Shipped</option>
                                <option value="Delivered">Delivered</option>
                            </select>
                            <button class="action-btn print-btn" onclick="printOrder('${data.id}')">Print</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch(e) {
                console.error("Error fetching orders:", e);
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Error loading orders. Ensure Firestore rules are open for testing.</td></tr>';
            }
        }

        window.changeStatus = async (orderId, newStatus) => {
            if(!newStatus) return;
            try {
                const orderRef = doc(db, "orders", orderId);
                await updateDoc(orderRef, { status: newStatus });
                fetchOrders(); // reload
            } catch(e) {
                console.error("Error updating status:", e);
                alert("Failed to update status.");
            }
        };

        window.printOrder = (orderId) => {
            const order = ordersList.find(o => o.id === orderId);
            if(!order) return;

            const date = order.createdAt ? new Date(order.createdAt.toMillis()).toLocaleString() : '';
            const itemsHtml = order.items.map(i => `<li>${i.name} (${i.size}) - Qty: ${i.qty} - &#8377;${i.price * i.qty}</li>`).join('');

            document.getElementById('printContent').innerHTML = `
                <h3>Order ID: ${order.id}</h3>
                <p><strong>Date:</strong> ${date}</p>
                <div style="margin-top:20px; border:1px solid #ccc; padding:15px;">
                    <h4>Shipping Details</h4>
                    <p><strong>Name:</strong> ${order.customerName}</p>
                    <p><strong>Phone:</strong> ${order.customerPhone}</p>
                    <p><strong>Address:</strong><br>${order.customerAddress.replace(/\n/g, '<br>')}</p>
                    <p><strong>Pincode:</strong> ${order.customerPin}</p>
                </div>
                <div style="margin-top:20px;">
                    <h4>Items Ordered</h4>
                    <ul>${itemsHtml}</ul>
                    <h3>Total: &#8377;${order.totalAmount}</h3>
                </div>
            `;

            document.getElementById('printArea').style.display = 'block';
            window.print();
            document.getElementById('printArea').style.display = 'none';
        };
    </script>
</body>
</html>
