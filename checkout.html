<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Sthirah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-page {
            padding: 4rem 0;
            background: var(--bg-color);
            min-height: 80vh;
        }
        .checkout-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .form-card, .order-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .form-card h2, .order-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-color);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--white);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .order-summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .order-total {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px solid var(--border);
            font-size: 1.2rem;
            font-weight: 800;
        }
        
        /* Address Cards */
        .saved-addresses {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .address-card {
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            background: var(--white);
        }
        .address-card:hover {
            border-color: #a3d9b5;
        }
        .address-card.selected {
            border-color: var(--accent-green);
            background: rgba(27,150,68,0.03);
        }
        .address-card p {
            margin: 0 0 0.3rem 0;
            font-size: 0.9rem;
            color: var(--text-color);
        }
        .address-card .name { font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem; }
        .edit-addr-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: var(--accent-green);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .edit-addr-btn:hover { text-decoration: underline; }

        .btn {
            width: 100%;
            background: var(--accent-green);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #157936; }
        .btn:disabled { background: #999; cursor: not-allowed; }
        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 2px dashed var(--border);
        }
        .btn-outline:hover { background: var(--bg-color); border-style: solid; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #ccc; }

        #loader {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        @media (max-width: 768px) {
            .checkout-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="navbar" style="position: static;">
        <div class="container nav-content">
            <a href="index.html" class="logo"><img src="assets/logo.png" alt="Sthirah Logo" class="logo-img"></a>
            <nav class="nav-links">
                <a href="cart.html">&larr; Back to Cart</a>
            </nav>
        </div>
    </header>

    <div class="checkout-page">
        <div class="container checkout-grid">
            <!-- Left: Addresses -->
            <div class="form-card">
                <h2>Shipping Address</h2>
                
                <div id="loadingAddresses" style="text-align:center; padding: 2rem; color:var(--text-muted);">
                    Loading addresses...
                </div>

                <div id="savedAddresses" class="saved-addresses" style="display:none;">
                    <!-- Injected via JS -->
                </div>

                <button id="showAddrFormBtn" class="btn btn-outline" style="display:none; margin-bottom: 1rem; font-size:1rem; padding: 0.8rem;">+ Add New Address</button>

                <form id="addressForm" style="display:none; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <h3 style="margin-bottom: 1rem; font-size:1.1rem;" id="formTitle">Add New Address</h3>
                    <input type="hidden" id="addrId">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="custName" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Contact Phone Number *</label>
                        <input type="tel" id="custPhone" required placeholder="9876543210">
                    </div>
                    <div class="form-group">
                        <label>Complete Address *</label>
                        <textarea id="custAddress" required placeholder="House No, Street, Landmark, City..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Pincode / ZIP *</label>
                        <input type="text" id="custPin" required placeholder="636015">
                    </div>
                    
                    <div style="display:flex; gap: 10px;">
                        <button type="submit" class="btn" style="flex:2; padding:0.8rem; font-size:1rem;" id="saveAddrBtn">Save Address</button>
                        <button type="button" class="btn btn-secondary" style="flex:1; padding:0.8rem; font-size:1rem;" id="cancelAddrBtn">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Right: Order Summary -->
            <div class="order-card">
                <h2>Order Summary</h2>
                <div id="summaryItems"></div>
                <div class="order-total">
                    <span>Total Amount</span>
                    <span>&#8377;<span id="summaryTotal">0</span></span>
                </div>
                <button type="button" class="btn" id="placeOrderBtn" style="border-radius:30px; margin-top:2rem;">Place Order</button>
            </div>
        </div>
    </div>

    <div id="loader">
        <p>Processing...</p>
    </div>

    <script type="module">
        import { auth, db, onAuthStateChanged, collection, addDoc, getDocs, updateDoc, doc, serverTimestamp } from './firebase-config.js';

        const cart = JSON.parse(localStorage.getItem('sthirah_cart') || '[]');
        if (cart.length === 0) {
            window.location.href = 'index.html'; // No cart, redirect
        }

        let currentUser = null;
        let cartTotal = 0;
        let selectedAddress = null;
        let addresses = [];

        // UI Elements
        const loadingAddresses = document.getElementById('loadingAddresses');
        const savedAddressesDiv = document.getElementById('savedAddresses');
        const showAddrFormBtn = document.getElementById('showAddrFormBtn');
        const addressForm = document.getElementById('addressForm');
        const cancelAddrBtn = document.getElementById('cancelAddrBtn');
        const formTitle = document.getElementById('formTitle');
        const placeOrderBtn = document.getElementById('placeOrderBtn');

        // Populate Summary
        const summaryContainer = document.getElementById('summaryItems');
        cart.forEach(item => {
            const itemTotal = item.qty * item.price;
            cartTotal += itemTotal;
            summaryContainer.innerHTML += `
                <div class="order-summary-item">
                    <span>${item.name} (${item.size}) x ${item.qty}</span>
                    <span>&#8377;${itemTotal}</span>
                </div>
            `;
        });
        document.getElementById('summaryTotal').textContent = cartTotal;

        // Auth guard
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html?redirect=checkout.html';
            } else {
                currentUser = user;
                await loadAddresses();
            }
        });

        // Load Addresses
        async function loadAddresses() {
            loadingAddresses.style.display = 'block';
            savedAddressesDiv.style.display = 'none';
            addressForm.style.display = 'none';
            showAddrFormBtn.style.display = 'none';

            try {
                const querySnapshot = await getDocs(collection(db, 'users', currentUser.uid, 'addresses'));
                addresses = [];
                querySnapshot.forEach((doc) => {
                    addresses.push({ id: doc.id, ...doc.data() });
                });

                renderAddresses();
            } catch (error) {
                console.error("Error fetching addresses:", error);
                alert("Failed to load addresses.");
            }
            loadingAddresses.style.display = 'none';
        }

        // Render Addresses
        function renderAddresses() {
            if (addresses.length === 0) {
                // Show form if no addresses
                showAddrFormBtn.style.display = 'none';
                openAddressForm();
                return;
            }

            savedAddressesDiv.innerHTML = '';
            addresses.forEach((addr, index) => {
                const isSelected = selectedAddress && selectedAddress.id === addr.id;
                
                // If nothing selected, auto-select first one
                if (!selectedAddress && index === 0) {
                    selectAddress(addr);
                    return; // Re-renders in selectAddress
                }

                savedAddressesDiv.innerHTML += `
                    <div class="address-card ${isSelected ? 'selected' : ''}" onclick="selectAddressById('${addr.id}')">
                        <button class="edit-addr-btn" onclick="event.stopPropagation(); editAddress('${addr.id}')">Edit</button>
                        <p class="name">${addr.name}</p>
                        <p>${addr.address}</p>
                        <p>PIN: ${addr.pin}</p>
                        <p>Ph: ${addr.phone}</p>
                    </div>
                `;
            });

            savedAddressesDiv.style.display = 'flex';
            showAddrFormBtn.style.display = 'block';
            addressForm.style.display = 'none';
        }

        // Global functions for inline onclicks
        window.selectAddressById = (id) => {
            const addr = addresses.find(a => a.id === id);
            if (addr) selectAddress(addr);
        };

        window.editAddress = (id) => {
            const addr = addresses.find(a => a.id === id);
            if (!addr) return;
            
            document.getElementById('addrId').value = addr.id;
            document.getElementById('custName').value = addr.name;
            document.getElementById('custPhone').value = addr.phone;
            document.getElementById('custAddress').value = addr.address;
            document.getElementById('custPin').value = addr.pin;
            
            formTitle.textContent = "Edit Address";
            addressForm.style.display = 'block';
            savedAddressesDiv.style.display = 'none';
            showAddrFormBtn.style.display = 'none';
        };

        function selectAddress(addr) {
            selectedAddress = addr;
            renderAddresses();
        }

        function openAddressForm() {
            document.getElementById('addressForm').reset();
            document.getElementById('addrId').value = "";
            formTitle.textContent = "Add New Address";
            
            // Prefill name if user has one
            if(currentUser && currentUser.displayName && addresses.length === 0) {
                document.getElementById('custName').value = currentUser.displayName;
            }

            addressForm.style.display = 'block';
            savedAddressesDiv.style.display = 'none';
            showAddrFormBtn.style.display = 'none';
        }

        showAddrFormBtn.addEventListener('click', openAddressForm);

        cancelAddrBtn.addEventListener('click', () => {
            if (addresses.length > 0) {
                renderAddresses();
            } else {
                alert("You must add at least one address to proceed.");
            }
        });

        // Save Form
        addressForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveAddrBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            const addrData = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddress').value,
                pin: document.getElementById('custPin').value,
            };
            const addrId = document.getElementById('addrId').value;

            try {
                if (addrId) {
                    // Update
                    await updateDoc(doc(db, 'users', currentUser.uid, 'addresses', addrId), addrData);
                } else {
                    // Add New
                    await addDoc(collection(db, 'users', currentUser.uid, 'addresses'), addrData);
                }
                await loadAddresses(); // Reload handles selection and UI
            } catch (error) {
                console.error("Error saving address:", error);
                alert("Error saving address. Please try again.");
            }
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Address';
        });

        // Place Order
        placeOrderBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            if (!selectedAddress) {
                alert("Please select or add a shipping address before placing your order.");
                return;
            }

            const loader = document.getElementById('loader');
            placeOrderBtn.disabled = true;
            loader.style.display = 'flex';

            const orderData = {
                customerId: currentUser.uid,
                customerEmail: currentUser.email || 'Phone User',
                customerName: selectedAddress.name,
                customerPhone: selectedAddress.phone,
                customerAddress: selectedAddress.address,
                customerPin: selectedAddress.pin,
                items: cart,
                totalAmount: cartTotal,
                status: 'Pending',
                createdAt: serverTimestamp()
            };

            try {
                // Save to Firestore 'orders' collection
                await addDoc(collection(db, 'orders'), orderData);
                
                // Clear cart
                localStorage.removeItem('sthirah_cart');
                
                // Show success
                loader.innerHTML = '<p style="color:#1b9644;">✅ Order Placed Successfully!</p><p style="font-size:1rem;margin-top:1rem;">Redirecting to home...</p>';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);

            } catch (error) {
                console.error("Error adding document: ", error);
                alert("There was an error processing your order. Please try again.");
                placeOrderBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
